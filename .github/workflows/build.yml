name: Build

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build release
        run: ./gradlew --no-daemon :module:zipRelease

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zygisk-Il2CppDumper
          path: |
            out/*.zip
            module/build/outputs/**/*.aar
          if-no-files-found: error
